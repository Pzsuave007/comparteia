# Nginx para comparteia.com  ->  app en 127.0.0.1:8080 (un solo puerto)
# Las 3 líneas "Upgrade/Connection" son imprescindibles para los WebSockets.
#
# Instalación:
#   sudo cp deploy/nginx-optional.conf /etc/nginx/sites-available/comparteia
#   sudo ln -s /etc/nginx/sites-available/comparteia /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d comparteia.com -d www.comparteia.com   # HTTPS automático

server {
    listen 80;
    listen [::]:80;
    server_name comparteia.com www.comparteia.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # --- WebSocket (imprescindible) ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ----------------------------------

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # conexiones WS largas
        proxy_send_timeout 3600s;
    }
}
