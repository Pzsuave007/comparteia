# OPCIONAL: solo si quieres un dominio con HTTPS delante del puerto interno.
# Lo esencial para que funcionen los WebSockets son las 3 líneas "Upgrade".
#
#   sudo apt install nginx
#   copia este archivo a /etc/nginx/sites-available/archivo y enlázalo,
#   luego: sudo certbot --nginx -d tudominio.com

server {
    listen 80;
    server_name tudominio.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # --- WebSocket (imprescindible) ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ----------------------------------

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # conexiones WS largas
        proxy_send_timeout 3600s;
    }
}
